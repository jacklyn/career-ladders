<title>2027 Product Design &amp; Research Career Ladder</title>

:root{
  --font:"Nunito","Nunito Sans","Segoe UI","Helvetica Neue",Arial,sans-serif;
  /* base */
  --text-primary:#141618; --text-secondary:#64686b; --text-disabled:#999d9f;
  --paper:#FFFFFF; --accent-bg:#F6F8FA; --selected:#F1F3F5; --divider:#DCDEE0; --input-line:#D5D8D9; --input-line-hover:#999D9F;
  --hover-fill:rgba(20,22,24,.04);
  /* primary */
  --primary:#0659F9; --primary-dark:#102B6E; --primary-hover:#0E49C7; --primary-outline:#A4C3FD; --primary-hover-bg:#EEF3FF; --primary-tag-bg:#D9E5FE; --focus:#4B87FB;
  /* status tags */
  --error:#E71B0C; --error-tag-bg:#FEE9E8; --error-tag:#C9180A;
  --success:#4CAF50; --success-tag-bg:#E2F4E1; --success-tag:#2D7429;
  --warning-tag-bg:#FFEEB2; --warning-tag:#7D6200; --warning:#FFC800;
  --appbar:#152C73; --on-appbar:#FFFFFF;
  /* elevation */
  --elev-1:0 0 1px 0 rgba(20,22,24,.31),0 0 1px 0 rgba(20,22,24,.25);
  --elev-2:0 0 1px 0 rgba(20,22,24,.31),0 1px 1px 0 rgba(20,22,24,.25);
  --elev-4:0 0 1px 0 rgba(20,22,24,.31),0 8px 12px 0 rgba(20,22,24,.15);
  /* chart series */
  --mine:#0659F9; --mine-fill:rgba(6,89,249,.14); --bench:#7D6200; --bench-fill:rgba(255,200,0,.20);
  /* grid: X-small default */
  --margin:16px; --gutter:16px;
  --radius:4px;
}
@media (min-width:1024px){:root{--margin:24px;--gutter:24px}}
@media (min-width:1440px){:root{--margin:32px;--gutter:32px}}
@media (min-width:1780px){:root{--margin:40px;--gutter:40px}}
@media (min-width:1920px){:root{--margin:48px;--gutter:48px}}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --text-primary:#E8EBEE; --text-secondary:#A4AAB0; --text-disabled:#7B8187;
    --paper:#1B2026; --accent-bg:#12161B; --selected:#262C33; --divider:#2F363E; --input-line:#3B434C; --input-line-hover:#6A727B;
    --primary:#7AA7FC; --primary-hover:#A4C3FD; --primary-outline:#2C4C93; --primary-hover-bg:#1B2A4A; --focus:#7AA7FC;
    --error:#F7766C; --error-tag-bg:#4A1F1C; --error-tag:#FBAFA9; --success:#4DBD46; --success-tag-bg:#1C3A1B; --success-tag:#8AD485;
    --mine:#7AA7FC; --mine-fill:rgba(122,167,252,.20); --bench:#FFD641; --bench-fill:rgba(255,200,0,.14);
    --elev-4:0 0 1px 0 rgba(0,0,0,.6),0 8px 12px 0 rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--accent-bg);color:var(--text-primary);font:400 16px/24px var(--font)}
h1,h2,h3{margin:0;color:var(--text-primary);font-family:var(--font)}
h1{font-size:32px;line-height:40px;font-weight:600}
h2{font-size:24px;line-height:32px;font-weight:600}
h3{font-size:20px;line-height:28px;font-weight:600}
p{margin:0}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:var(--radius)}

/* app bar: elevation 1 */
.appbar{position:relative;z-index:30;background:var(--appbar);color:var(--on-appbar);height:56px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 max(var(--margin),calc((100vw - 1280px) / 2));box-shadow:var(--elev-1)}
.appname{font-size:20px;line-height:28px;font-weight:600}
.src{font-size:12px;line-height:16px}

/* grid: fixed layout, centred, max 1280 */
.wrap{max-width:calc(1280px + var(--margin)*2);margin:0 auto;padding:0 var(--margin) 56px}
.stack>*+*{margin-top:var(--gutter)}
.stack>:first-child{margin-top:var(--gutter)}

/* navigation: tabs */
.tabsbar{background:var(--paper);border-bottom:1px solid var(--divider)}
.tabsbar:empty{display:none}
.tabs{display:flex;gap:32px;max-width:calc(1280px + var(--margin)*2);margin:0 auto;padding:0 var(--margin)}
.tab{border:0;background:transparent;padding:16px 2px 14px;cursor:pointer;color:var(--text-secondary);font-weight:600;font-size:16px;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--text-primary);background:var(--hover-fill)}
.tab[aria-pressed="true"]{color:var(--text-primary);border-bottom-color:var(--primary)}

/* page title: top-left, largest type */
.pagehead{padding-top:8px}
.meta{display:flex;flex-wrap:wrap;margin-top:4px;color:var(--text-secondary);font-size:14px;line-height:20px}
.meta>span{padding:0 12px;border-left:1px solid var(--divider)}
.meta>span:first-child{padding-left:0;border-left:0;font-weight:700;color:var(--text-primary)}

/* containers: elevation 2 (resting card) on accent background */
.card{background:var(--paper);border-radius:8px;padding:24px;box-shadow:var(--elev-2)}
/* sticky level selector overlays content: elevation 4 */
.picker{position:sticky;top:0;z-index:20;box-shadow:var(--elev-4);display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:12px 24px}
.picker label{font-weight:600;font-size:14px}
.picker select{min-width:min(100%,380px)}
.ctx{color:var(--text-secondary);font-size:14px}
.note{color:var(--text-secondary);font-size:14px;line-height:20px;margin-top:6px}
.warn{background:#FFF5D0;color:#302500;border-radius:8px;padding:12px 16px;box-shadow:var(--elev-2)}
.warn summary{cursor:pointer;font-weight:600}
.warn ul{margin:8px 0 2px;padding-left:20px;font-size:14px}
.err{background:#FDECEA;color:#510A04;border-radius:8px;padding:12px 16px}

/* body text */
.desc{margin-top:8px;max-width:80ch}
.facets{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px var(--gutter);margin:20px 0 0}
.facets div{min-width:0}
.facets dt{font-weight:700;font-size:12px;line-height:16px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-secondary);margin-bottom:4px}
.facets dd{margin:0;white-space:pre-line;font-size:14px;line-height:20px}
.good{margin:20px 0 0;padding-top:16px;border-top:1px solid var(--divider)}
.good ul{margin:8px 0 0;padding-left:20px;max-width:90ch;font-size:14px;line-height:20px}
.good li{margin:4px 0}

/* scoring */
.score-grid{display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:var(--gutter);align-items:start}
.sum{margin:8px 0 16px;color:var(--text-secondary);font-size:14px;line-height:20px}
.sum b{color:var(--text-primary);font-weight:700}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}

/* buttons: outlined variant */
.btn{background:transparent;border:1px solid var(--primary-outline);color:var(--primary);border-radius:var(--radius);padding:7px 16px;cursor:pointer;font-weight:600;font-size:14px;line-height:20px}
.btn:hover{background:var(--primary-hover-bg)}
.btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn.primary:hover{background:var(--primary-hover)}

/* table */
.rows{border:1px solid var(--divider);border-radius:8px;overflow:hidden}
.row,.rowhead{display:grid;grid-template-columns:minmax(0,1fr) 150px 110px 130px;gap:8px 12px;align-items:center;padding:12px 16px;border-top:1px solid var(--divider)}
.rowhead{font-size:12px;line-height:16px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-secondary);background:var(--selected);border-top:0}
.row{box-shadow:inset 4px 0 0 var(--success);font-size:14px;line-height:20px}
.row:hover{background-color:var(--hover-fill)}
.row.short{box-shadow:inset 4px 0 0 var(--error)}
.cname{font-weight:600;font-size:16px;line-height:24px}
.cdef{display:block;font-weight:400;font-size:14px;line-height:20px;color:var(--text-secondary);margin-top:2px;max-width:60ch}

/* select: outlined variant */
select{border:1px solid var(--input-line);border-radius:var(--radius);background:var(--paper);padding:7px 8px;font-size:14px;line-height:20px;color:var(--text-primary)}
select:hover{border-color:var(--input-line-hover)}
.row select{width:100%}
.row select.edited{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary)}

/* tag: caps 12 bold */
.gap{display:inline-block;border-radius:4px;padding:2px 8px;font-weight:700;font-size:12px;line-height:16px;letter-spacing:.06em;text-transform:uppercase}
.gap.short{background:var(--error-tag-bg);color:var(--error-tag)}
.gap.ok{background:var(--success-tag-bg);color:var(--success-tag)}
.gap.none{color:var(--text-disabled);font-weight:400;text-transform:none;letter-spacing:0;padding:2px 0;font-size:14px}
.lab{display:none}

/* chart and reference tables */
.radar-box{min-width:0;position:sticky;top:96px;max-height:calc(100vh - 112px);overflow-y:auto;padding-right:4px}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:8px;font-size:14px;line-height:20px}
.legend span{display:inline-flex;align-items:center;gap:8px}
svg.radar{width:100%;height:auto;display:block}
svg.radar text{fill:var(--text-primary);font:400 13px var(--font)}
.refbox{margin-top:24px;padding-top:16px;border-top:1px solid var(--divider)}
.refbox table{width:100%;border-collapse:collapse;margin-top:8px;font-size:14px;line-height:20px}
.refbox td,.refbox th{padding:6px;border-bottom:1px solid var(--divider);text-align:left;vertical-align:top}
.refbox th{color:var(--text-secondary);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}

/* growth */
.growth table{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px;line-height:20px}
.growth th,.growth td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--divider);vertical-align:top}
.growth th{font-size:12px;line-height:16px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-secondary);background:var(--selected)}
.growth .num{white-space:nowrap}
.cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px var(--gutter);margin-top:20px}
.cols2 ul{margin:8px 0 0;padding-left:20px;font-size:14px;line-height:20px}
.cols2 p{font-size:14px;line-height:20px}
.empty{color:var(--text-secondary)}

/* breakpoints (min-width): single column below Medium (1024), stacked rows below Small (768) */
@media (max-width:1023px){
  .score-grid{grid-template-columns:1fr}
  .radar-box{order:-1;position:static;max-height:none;overflow:visible}
}
@media (max-width:767px){
  h1{font-size:24px;line-height:32px}
  .rowhead{display:none}
  .row{grid-template-columns:1fr 1fr 1fr;padding:12px 14px}
  .row>.cname{grid-column:1/-1}
  .lab{display:block;font-size:12px;line-height:16px;color:var(--text-secondary);font-weight:700;margin-bottom:2px}
  .card{padding:16px}
  .picker{padding:12px 16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

; has built capability across several teams or organizations.", "leadership": "Level 5–6 (I intend to / I've done)", "direction": "Sets direction for the discipline. Anticipates shifts in technology and product and shapes strategy with design and product leadership.", "scope": "Content strategy, voice, and standards across the company's products; content tooling and AI workflows that affect every team.", "craft": "Defines what excellent content design looks like at the company; shapes the standards that become the default.", "promotion": "Shapes company-level strategy and standards; builds the next generation of content design leaders; represents the company's content practice externally.", "good": ["Defines the multi-year content vision for the products", "Anticipates shifts such as AI-generated content and prepares the company for them", "Builds capability and leaders across the content design community", "Is the trusted advisor to design and product leadership on content"], "bench": [5, 5, 5, 4, 5, 5, 4, 4, 5, 5]}, {"framework": "Content Design", "track": "Manager", "order": 1, "code": "CDM4", "title": "Content Design Manager", "description": "Manager of a team of content designers who builds a healthy, high-performing team, sets content priorities with design and product partners, and develops the team's craft and careers.", "keywords": "Team building, prioritization, coaching, quality, partner alignment", "prior": "Has led content designers or writers on delivery; coached early and mid-career team members; managed priorities across design, product, and engineering partners.", "leadership": "Level 4–5 (I recommend / I intend to)", "direction": "Leads through clear priorities and decisions; coaches the team to make good calls independently.", "scope": "A team of content designers and the product areas they support; coordination with several product teams.", "craft": "Maintains quality through shared review practices and clear standards for voice, accessibility, and terminology.", "promotion": "Builds a reliable, healthy team; develops content designers who grow in level; delivers predictably with partners; improves how teams collaborate on content.", "good": ["Sets clear priorities and communicates tradeoffs to partners", "Coaches content designers with regular, specific feedback and growth plans", "Keeps content quality and delivery consistent", "Builds a team culture of craft, evidence, and shared ownership"], "bench": [3, 3, 3, 3, 3, 3, 4, 3, 4, 4]}, {"framework": "Content Design", "track": "Manager", "order": 2, "code": "CDM5", "title": "Senior Content Design Manager", "description": "Senior manager who leads a larger content design team or several related areas, develops senior content designers and emerging leads, and aligns content strategy with product and business strategy.", "keywords": "Org design, senior talent, content strategy, cross-team alignment, operating rhythm", "prior": "Has built and sustained a high-performing team, grown senior talent, and improved collaboration and content operations across teams.", "leadership": "Level 5 (I intend to)", "direction": "Leads through delegation and clear decision-making; aligns complex work across teams; anticipates resourcing and delivery risks.", "scope": "A larger content design team or multiple product areas; cross-organization alignment and operating routines.", "craft": "Evaluates quality through senior content designers and shared review practices; ensures standards are sustained across workstreams.", "promotion": "Develops senior talent and future leads; improves consistency and execution across teams; shows measurable improvements in content quality or product outcomes.", "good": ["Develops senior content designers and emerging leads through purposeful coaching", "Aligns content strategy with product and business priorities", "Improves cross-team operating routines, capacity planning, and quality", "Represents content design in leadership forums"], "bench": [ earch, observation, and feedback. Plans or contributes to appropriately scoped evaluative studies, including designer-led unmoderated usability tests; interprets results responsibly and applies findings to improve experience decisions. Involves specialist researchers when methods, audiences, or risks require deeper expertise."}, {"name": "Storytelling", "definition": "Presents credible, accessible narratives connecting customer needs, design decisions, product value, and the action required."}, {"name": "Growth Mindset", "definition": "Seeks and applies feedback, demonstrates curiosity, develops capability, and supports learning without requiring a particular personality style."}, {"name": "Teamwork & Force Multiplier", "definition": "Collaborates effectively and creates conditions that improve others' work, quality, alignment, and collective results."}, {"name": "Product Knowledge", "definition": "Understands product users, flows, constraints, platform connections, and experience opportunities at the level relevant to the role."}, {"name": "Business Knowledge", "definition": "Understands the relevant business model, industry, customer value, priorities, and the constraints influencing product decisions."}, {"name": "Leadership", "definition": "Creates clarity, ownership, and growth through influence or direct people management; for managers, includes coaching, fair performance management, talent development, and team health."}, {"name": "Strategy", "definition": "Sets or contributes to design direction that connects customer evidence and product decisions to organizational goals."}, {"name": "Design Craft & Systems", "definition": "Applies and scales high-quality interaction, information architecture, visual and content design, accessibility, prototyping, design systems, and feasible design-to-engineering delivery."}, {"name": "Product Outcomes & Impact", "definition": "Connects design decisions to clearly defined customer, product, team, or business outcomes and uses proportionate evidence to assess and improve impact."}], "Design Research": [{"name": "Research Communication & Storytelling", "definition": "Quality, clarity, and persuasiveness of how research findings and implications are communicated verbally, visually, and in writing to varied audiences."}, {"name": "Research Problem Framing", "definition": "Ability to identify, scope, and articulate the right research questions — translating ambiguous product or business challenges into clear, actionable inquiry."}, {"name": "Human-Centered Inquiry", "definition": "Depth of engagement with people being studied — including recruitment, facilitation, observation, and surfacing authentic human needs, behaviors, and motivations."}, {"name": "Insight Synthesis & Narrative", "definition": "Ability to move from raw data to patterns, and from patterns to meaningful insights — constructing a coherent, evidence-backed story that drives decisions."}, {"name": "Growth Mindset", "definition": "Demonstration of continuous learning, intellectual curiosity, coachability, and a healthy approach to giving and receiving feedback in a research context."}, {"name": "Collaboration & Force Multiplier", "definition": "Relationship to cross-functional teams and the ability to facilitate alignment and amplify research impact across the organization."}, {"name": "Product & Domain Knowledge", "definition": "Understanding of the product, its users, and the domain being researched — enabling research to be grounded in real product context and user reality."}, {"name": "Business Acumen", "definition": "Understanding of business goals, priorities, and decision-making context — enabling research to connect to strategy, investment, and roadmap."}, {"name": "Leadership & Talent Development", "definition": "Explicit and implicit role modeling, mentoring, and leadership behaviors — including developing others' research capabilities and shaping team culture."}, {"name": "Research Strategy & Methods", "definition": "Breadth and depth of research methodology — including selection, design, execution, and innovation of appropriate methods for a given challenge."}], "Design Engineering": [{"name": "Design System Engineering", "definition": "Builds and evolves the design system (tokens, component library, documentation, and guidelines) so designers, engineers, and AI tools can discover, understand, and use it confidently."}, {"name": "Component Engineering", "definition": "Builds reusable, accessible, flexible, and performant production components across React, React Native, and Qt/QML, with sound component architecture, APIs, and states."}, {"name": "Design-to-Code Translation", "definition": "Turns Figma designs into production code and keeps the two aligned. Uses variables, auto layout, Dev Mode, and Code Connect so design intent survives implementation."}, {"name": "Accessibility & Inclusive UI", "definition": "Builds interfaces that meet WCAG and related standards, including semantic HTML, keyboard interaction, focus management, ARIA patterns, and accessible data visualization."}, {"name": "AI-Assisted Workflows", "definition": "Uses and builds AI-assisted tooling (MCP integrations, agents, plugins, automation, design-to-code workflows) and makes the system readable and reliable for AI as well as people."}, {"name": "Tooling & Quality Automation", "definition": "Builds the workflows and infrastructure that let teams prototype and ship with real components: Storybook, Git, documentation platforms, and visual regression, accessibility, and CI/CD testing."}, {"name": "Craft & Quality Bar", "definition": "Sets and holds a high bar for visual quality, interaction design, and consistency in everything built, and raises it for others through reviews and standards."}, {"name": "Cross-Functional Collaboration", "definition": "Works fluidly across design and engineering, translating between disciplines and helping product teams adopt the system without sacrificing quality."}, {"name": "Autonomy & Ownership", "definition": "Takes ownership of problems from framing to delivery, from working with guidance on assigned work to setting direction and managing complex programs independently."}, {"name": "Influence & Adoption", "definition": "Grows adoption and impact of the system across teams, shapes standards, and builds the capability of the wider design and engineering community."}], "Content Design": [{"name": "Content Craft & Writing", "definition": "Writes clear, concise, useful words for the interface (labels, messages, guidance, empty states, and errors) that help people complete tasks and understand complex products."}, {"name": "Content Strategy & Information Architecture", "definition": "Plans what content is needed, where it lives, and how it is organized, so structure, naming, and navigation make complex products understandable."}, {"name": "Voice, Tone & Content Standards", "definition": "Defines, applies, and maintains voice, tone, terminology, and content patterns, and builds them into the design system so they scale."}, {"name": "Research & Content Testing", "definition": "Uses research, usability findings, and content testing to shape and validate content decisions with evidence."}, {"name": "Accessibility & Inclusive Language", "definition": "Writes plain, inclusive, accessible, and translation-ready content that works for screen readers, global audiences, and a range of abilities."}, {"name": "Complex & Technical Content", "definition": "Makes configuration-heavy, data-rich, and technical workflows understandable, actionable, and trustworthy for expert and non-expert users."}, {"name": "Collaboration & Partnership", "definition": "Partners with design, product, engineering, research, and subject-matter experts, and negotiates content decisions through the whole product process."}, {"name": "Content Operations & AI", "definition": "Uses and governs content tooling, workflows, and AI-assisted writing to improve quality, consistency, and speed while protecting accuracy and voice."}, {"name": "Autonomy & Ownership", "definition": "Takes ownership of content problems from framing to delivery, from working with guidance on assigned work to setting direction across complex programs."}, {"name": "Influence & Advocacy", "definition": "Advocates for content as a design discipline, influences product decisions and standards, and builds the capability of others."}]}, "levelComp": {"P1": {"Communication": "Clearly writes, speaks, and presents material familiar to them. Actively listens, takes notes, and applies advice received from more senior team members. Communicates at Level 1-2 on DM Ladder.", "Problem Solving": "Demonstrates proactive learning of best practices for recognizing, exploring, and solving common design problems; Solution quality varies.", "Customer Empathy": "Observes or participates in customer research and usability sessions. Describes users' basic goals, motivations, and barriers, and recognizes how user evidence informs design decisions.", "Storytelling": "Presents in Design team meetings. Able to articulate the context and their rationale effectively. Effective use of visuals (diagrams, illustrations, models) to support their story.", "Growth Mindset": "Seeks learning and constructive feedback, asks clarifying questions, applies critique, and reflects on progress without requiring a particular personality style.", "Teamwork & Force Multiplier": "A punctual, contributing member to their assigned teams and meetings, and a positive addition to all team collaborations.", "Product Knowledge": "Familiar with basic hardware solutions, digital products (web and mobile), their features and workflows. May be unfamiliar with advanced functions and use cases.", "Business Knowledge": "Beginner knowledge of business and industry.", "Leadership": "Takes ownership of assigned commitments, follows through, asks for help early, and contributes respectfully to team learning.", "Strategy": "Understands the immediate purpose of assigned work and how it connects to team goals.", "Design Craft & Systems": "Uses established components and interaction patterns with guidance; creates basic flows and states; learns accessibility, content, visual hierarchy, and handoff fundamentals. Experiments with prototypes and tools while checking quality with a mentor.", "Product Outcomes & Impact": "Understands the purpose of the assigned work and can describe a user problem or expected improvement. Documents feedback and learns how results are measured."}, "P2": {"Communication": "Demonstrates competence and increasing confidence in presenting material. Willing to share a POV to positively contribute to team discussions. Asks thoughtful questions to inform themselves and the team. Communicates at Level 2-3 on DM ladder.", "Problem Solving": "Applies best practices to common design problems. Demonstrates persistence and ability to work independently on problems. Seeks input from peers and leads when facing ambiguity.", "Customer Empathy": "Contributes to research planning, execution, and synthesis. Helps prepare clear usability tasks, observes user behavior, accurately summarizes needs and findings, and uses feedback to improve defined workflows.", "Storytelling": "Presents design work with clarity and context. Uses visuals and structured narratives to explain the “why” behind design decisions. Presents with confidence to a familiar audience.", "Growth Mindset": "Welcomes feedback and incorporates it without defensiveness. Asks clarifying questions and reflects on opportunities to improve. Proactively seeks learning opportunities (e.g., trying new tools or learning new technologies and methodologies).", "Teamwork & Force Multiplier": "Contributes reliably to team rituals and project work. Collaborates effectively across disciplines and actively contributes to critiques and workshops to make them better. Offers support to peers and shares useful tools or resources.", "Product Knowledge": "Understands core features and user flows of the product. Can explain how users interact with key workflows. Early understanding of edge cases and cross-system dependencies.", "Business Knowledge": "Demonstrated increase in business and industry knowledge.\t Demonstrates basic understanding of the product’s business model and customer base. Able to discuss business goals and how design contributes to success. Starting to ask strategic questions in team discussions.", "Leadership": "Owns a small scope, communicates commitments, helps peers when possible, and shares constructive input in team discussions.", "Strategy": "Identifies how a defined workflow supports product priorities and contributes options within the established plan.", "Design Craft & Systems": "Independently designs well-bounded flows with appropriate states, responsive behavior, and handoff detail; applies design-system patterns and checks accessibility with review.", "Product Outcomes & Impact": "Identifies practical success criteria for a scoped feature, uses feedback or basic usability evidence to refine decisions, and follows through on implementation quality."}, "P3": {"Communication": "Clearly presents design intent, rationale, tradeoffs, and open questions to designers, Product, and Engineering; listens, adapts, and makes recommendations.", "Problem Solving": "Demonstrates confidence in applying best practices to common design problems and discerning between potential solutions. Design choices are solid, consistently strong, with supporting rationale.", "Customer Empathy": "Plans, sets up, and runs straightforward unmoderated usability studies (e.g., Maze) with guidance or review. Defines a focused research question, writes neutral tasks, considers participant fit and success criteria, summarizes findings and limitations, and applies what was learned to design iterations.", "Storytelling": "Presents with confidence to non-design team members and earns their respect. Works to garner support for their design direction and keep conversations focused. Storytelling centers on customer needs aligned to a specific feature.", "Growth Mindset": "Ability to give and receive constructive feedback to/from colleagues when there is a strong, trusted relationship. Proactively learns new tools and methods and creates opportunities to share with the team.", "Teamwork & Force Multiplier": "May lead collaboration efforts on small teams and projects, drive project-level meetings, and assist organizing/faciliitating workshops.", "Product Knowledge": "Capable of walking a customer through the core features of the product. Growing comfort with edge cases and awareness of cross-system dependencies. Has a POV on product portfolio and opportunities for UX improvements.", "Business Knowledge": "Ability to converse effectively about business model and customers with peers and manager. Demonstrates proactive behavior in learning about our business, industry, and company performance without waiting to receive it.", "Leadership": "Independently drives a scoped initiative and supports peers through critique, knowledge sharing, and positive cross-functional collaboration.", "Strategy": "Recommends design approaches for a product problem, considers constraints, and contributes to feature-level decisions.", "Design Craft & Systems": "Designs coherent end-to-end workflows; handles common edge cases, information architecture, accessibility, prototyping, and reusable component patterns. Selects tools, including AI assistance when useful, with critical review.", "Product Outcomes & Impact": "Defines observable user or product outcomes with partners, evaluates tradeoffs, and uses research, analytics, or post-release learning to improve the result."}, "P4": {"Communication": "Articulates design decisions and rationale expertly to influence/persuade others. Communicates well up, across, and down. Identifies communication gaps and drives to resolve them. Communicates consistently at Level 5 on DM ladder.", "Problem Solving": "Applies best practices consistently. Explores and validates novel, innovative solutions where needed in order to solve new or complex problem spaces.", "Customer Empathy": "Independently plans, conducts, analyzes, and acts on evaluative research for their design work, including unmoderated usability studies (e.g., Maze). Defines clear research questions, realistic neutral tasks, appropriate audiences, and success criteria; pilots the study; interprets behavioral and qualitative results with awareness of sample and method limitations; communicates actionable findings and iterates. Partners with research specialists for complex or sensitive studies.", "Storytelling": "Builds persuasive, evidence-based product stories for cross-functional partners and stakeholders; connects customer problems to the design direction and expected outcomes.", "Growth Mindset": "Ability to give and receive effective feedback under difficult circumstances, conveying positive intent and ensuring psychological safety. Identifies learning opportunities for self and others. Recognized by others for their continuous improvement mindset.", "Teamwork & Force Multiplier": "Comfortable leading larger team initiatives, projects, or workshops as a key organizer, driver, and influencer. Proactively demonstrates and shares learning and growth for self and team. Actively helps others do their best work.", "Product Knowledge": "Highly familiar with all primary workflows for products in their domain space. Ability to teach others how our customers use our products, including workarounds and expert tips. Makes an effort to engage with our products, product experts, and product-using customers on a regular basis.", "Business Knowledge": "Able to converse effectively with leadership & customers about business model and ecosystem. Proactively shares understanding, observed trends, and considerations of business and industry with team. Asks questions in team and company settings to help inspire innovation and potential for experience improvements.", "Leadership": "Mentors less experienced designers, models high-quality judgment, and helps teams make better decisions without formal authority.", "Strategy": "Defines a coherent experience approach for a complex product-area problem and aligns partners on tradeoffs and success criteria.", "Design Craft & Systems": "Sets the craft bar for complex journeys; balances interaction, content, visual systems, accessibility, design-system contribution, and feasibility. Reviews solutions through validation and implementation.", "Product Outcomes & Impact": "Connects design direction to user and product outcomes, agrees on evidence with partners, and demonstrates improvement in usability, quality, task success, or similar relevant results."}, "P5": {"Communication": "Models clear communication across teams and with senior stakeholders; tailors narratives and mentors others to explain decisions, tradeoffs, and intended impact.", "Problem Solving": "Demonstates ability to effectively lead others through problem-solving activities to reach positive outcomes. Skilled at modeling and teaching problem-framing and solving approaches to design team members and to partners.", "Customer Empathy": "Makes evaluative research a consistent part of design work across connected workflows. Coaches designers in planning sound studies, writing unbiased tasks, choosing appropriate participants and measures, interpreting findings, and acting on evidence. Synthesizes learning across teams and partners with researchers on deeper or specialized studies.", "Storytelling": "A persuasive and strategic storyteller that anticipates audience engagement with the message. Storytelling weaves in elements of our industry and business, consumer and business trends, and experience design principles.", "Growth Mindset": "Excels at giving and receiving feedback with the intent of fostering growth and development of self and others on team. Actively seeks ways to organize and/or deliver training to team (and non-team members) to benefit personal growth and development.", "Teamwork & Force Multiplier": "Skilled at helping others be successful in their teamwork settings, meetings, and collaboration efforts. Role model for others on how to engage in meetings, workshops and collaboration initiatives. Actively seeks and finds opportunities for achieving outsized results by inspiring and engaging others to contribute and deliver.", "Product Knowledge": "Deeply familiar with our product and competitive products. Able to lead conversation with all other roles in company (Sales, Eng, Mktg, LT) effectively about features, details, and value props of product.", "Business Knowledge": "Effectively communicates & teaches business model/ecosystem to others in org. Explores and suggests alternatives and enhancements where appropriate.", "Leadership": "Leads experience work through other designers, delegates responsibly, coaches craft and problem framing, and builds alignment across teams.", "Strategy": "Establishes experience direction across connected initiatives and translates strategy into reusable decisions and team execution.", "Design Craft & Systems": "Guides multiple designers toward a coherent design language; resolves cross-flow inconsistencies, promotes accessibility and system reuse, and raises design–engineering handoff quality. Evaluates emerging tools by their results.", "Product Outcomes & Impact": "Sets shared experience outcomes across teams, monitors meaningful evidence, and demonstrates that a coordinated design direction improves customer experience or team/product effectiveness."}, "P6": {"Communication": "Tailors messages for varied audiences, including executives. Synthesizes complex insights and design direction into clear, compelling narratives that influence roadmaps and cross-functional strategies. Mentors others in high-stakes communication.", "Problem Solving": "Defines and frames st }

async function parseWorkbook(buf){

    const fw = fwOf(r); ensureFw(fw);

/* ---------- radar ---------- */
function wrapLabel(t, max){
  const words = t.split(/\s+/), lines = []; let cur = '';
  for (const w of words){ if ((cur + ' ' + w).trim().length > max && cur){ lines.push(cur); cur = w; } else cur = (cur + ' ' + w).trim(); }
  if (cur) lines.push(cur); return lines;
}
function drawRadar(host, comps, bench, mine){
  host.textContent = '';
  const W = 540, H = 460, cx = W / 2, cy = H / 2 + 4, R = 128, n = comps.length;
  const ang = i => -Math.PI / 2 + i * 2 * Math.PI / n;
  const pt = (i, v) => [cx + R * v / 5 * Math.cos(ang(i)), cy + R * v / 5 * Math.sin(ang(i))];
  const svg = s('svg', { class: 'radar', viewBox: '0 0 ' + W + ' ' + H, role: 'img', 'aria-label': 'Radar chart comparing your scores with the level benchmark across ' + n + ' competencies. The table lists the same values.' });
  for (let r = 1; r <= 5; r++){
    svg.append(s('polygon', { points: comps.map((_, i) => pt(i, r).join(',')).join(' '), fill: 'none', stroke: 'var(--divider)', 'stroke-width': r === 5 ? 1.5 : 1 }));
    svg.append(s('text', { x: cx + 4, y: cy - R * r / 5 + 3, 'font-size': 9.5, style: 'fill:var(--text-secondary)' }, r));
  }
  comps.forEach((c, i) => {
    const [x, y] = pt(i, 5); svg.append(s('line', { x1: cx, y1: cy, x2: x, y2: y, stroke: 'var(--divider)' }));
    const lx = cx + (R + 16) * Math.cos(ang(i)), ly = cy + (R + 16) * Math.sin(ang(i));
    const cos = Math.cos(ang(i)), anchor = Math.abs(cos) < .2 ? 'middle' : cos > 0 ? 'start' : 'end';
    const lines = wrapLabel(c.name, 17), dy0 = Math.sin(ang(i)) > .5 ? 10 : Math.sin(ang(i)) < -.5 ? -(lines.length - 1) * 13 - 2 : -(lines.length - 1) * 6.5 + 4;
    const t = s('text', { x: lx, y: ly + dy0, 'text-anchor': anchor });
    lines.forEach((ln, k) => t.append(s('tspan', { x: lx, dy: k ? 13 : 0 }, ln)));
    svg.append(t);
  });
  if (mine.some(v => v !== undefined)){
    const m = mine.map(v => v === undefined ? 0 : v);
    svg.append(s('polygon', { points: m.map((v, i) => pt(i, v).join(',')).join(' '), fill: 'var(--mine-fill)', stroke: 'var(--mine)', 'stroke-width': 2.5, 'stroke-linejoin': 'round' }));
    m.forEach((v, i) => { if (mine[i] === undefined) return; const [x, y] = pt(i, v); svg.append(s('circle', { cx: x, cy: y, r: 4.5, fill: 'var(--mine)', stroke: 'var(--paper)', 'stroke-width': 2 }, s('title', null, comps[i].name + ' you: ' + v))); });
  }
  const hasB = bench.some(v => v !== null);
  if (hasB){
    const b = bench.map(v => v === null ? 0 : v);
    svg.append(s('polygon', { points: b.map((v, i) => pt(i, v).join(',')).join(' '), fill: 'var(--bench-fill)', stroke: 'var(--bench)', 'stroke-width': 2, 'stroke-dasharray': '6 4', 'stroke-linejoin': 'round' }));
    b.forEach((v, i) => { const [x, y] = pt(i, v); svg.append(s('rect', { x: x - 4, y: y - 4, width: 8, height: 8, fill: 'var(--bench)', stroke: 'var(--paper)', 'stroke-width': 2 }, s('title', null, comps[i].name + ' benchmark: ' + v))); });
  }
  host.append(svg);
}

/* ---------- render ---------- */
const app = document.getElementById('app');
let refs = null;

function gapCell(score, bench){
  if (score === undefined || bench === null) return h('span', { class: 'gap none' }, '–');
  const g = score - bench;
  if (g < 0) return h('span', { class: 'gap short' }, '▼ ' + Math.abs(g) + ' below');
  if (g === 0) return h('span', { class: 'gap ok' }, '✓ on target');
  return h('span', { class: 'gap ok' }, '▲ ' + g + ' above');
}
function render(){
  app.textContent = ''; document.getElementById('fwtabs').textContent = '';
  document.getElementById('source').textContent = '';
  if (state.error){
    app.append(h('div', { class: 'err', role: 'alert' }, h('b', null, 'Could not read the data. '), state.error,
      h('p', { class: 'note' }, 'Check that Career_Ladders_Data.xlsx is saved next to this page.')));
    if (!state.data) return;
  }
  if (!state.data){
    app.append(h('div', { class: 'card empty' }, 'No data yet. Save Career_Ladders_Data.xlsx next to this page.')); return;
  }
  if (state.warnings.length){
    app.append(h('details', { class: 'warn' }, h('summary', null, state.warnings.length + ' thing' + (state.warnings.length > 1 ? 's' : '') + ' to check in the Excel data'),
      h('ul', null, state.warnings.map(w => h('li', null, w)))));
  }
  const d = state.data;
  if (d.frameworks.length > 1){
    document.getElementById('fwtabs').append(h('div', { class: 'tabs', role: 'group', 'aria-label': 'Career ladder' }, d.frameworks.map(f => h('button', {
      type: 'button', class: 'tab', 'aria-pressed': String(f.name === state.fw),
      onclick: () => { state.lastCode[state.fw] = state.code; const to = state.lastCode[f.name] || d.levels.find(l => l.framework === f.name).code; setLevel(to); lsSet(); writeHash(); render(); } }, f.name))));
  }
  const sel = h('select', { id: 'level', 'aria-label': 'Level', onchange: e => { setLevel(e.target.value); lsSet(); writeHash(); renderLevel(); } });
  for (const [track, name] of [['IC', 'Individual contributor'], ['Manager', 'Manager']]){
    const ls = d.levels.filter(l => l.framework === state.fw && l.track === track); if (!ls.length) continue;
    const g = h('optgroup', { label: name });
    ls.forEach(l => g.append(h('option', { value: l.code, selected: l.code === state.code }, l.code + ' · ' + l.title)));
    sel.append(g);
  }
  const fi = fwInfo();
  app.append(h('section', { id: 'pagehead', class: 'pagehead' }));
  app.append(h('div', { class: 'card picker' }, h('label', { for: 'level' }, 'Level'), sel, h('span', { class: 'ctx', id: 'ctx' })));
  app.append(h('section', { id: 'overview', class: 'card', 'aria-live': 'polite' }));
  app.append(h('section', { id: 'scoring', class: 'card' }));
  app.append(h('section', { id: 'growth', class: 'card growth' }));
  renderLevel();
}
function renderLevel(){
  const l = lvl(), d = state.data, cs = comps();
  const ov = document.getElementById('overview'); ov.textContent = '';
  document.getElementById('ctx').textContent = l.framework + ' · ' + (l.track === 'IC' ? 'Individual contributor' : 'Manager');
  const ph = document.getElementById('pagehead'); ph.textContent = '';
  ph.append(h('h1', null, l.title), h('div', { class: 'meta' }, h('span', null, l.code), h('span', null, l.track === 'IC' ? 'Individual contributor' : 'Manager')));
  ov.append(h('h2', null, 'Role overview'));
  if (l.description) ov.append(h('p', { class: 'desc' }, l.description));
  const facets = [['Keywords', l.keywords], ['Prior achievements', l.prior], ['Leadership ladder', l.leadership], ['Direction', l.direction], ['Scope & impact', l.scope], [(fwInfo() || {}).craftLabel || 'Craft', l.craft], ['Promotion signals', l.promotion]].filter(f => f[1]);
  if (facets.length) ov.append(h('dl', { class: 'facets' }, facets.map(f => h('div', null, h('dt', null, f[0]), h('dd', null, f[1])))));
  if (l.good.length) ov.append(h('div', { class: 'good' }, h('h3', null, 'What good looks like'), h('ul', null, l.good.map(x => h('li', null, x)))));
  const sc = document.getElementById('scoring'); sc.textContent = '';
  refs = { gaps: [], selects: [], rows: [] };
  const rows = h('div', { class: 'rows', role: 'table', 'aria-label': 'Competency scores' });
  rows.append(h('div', { class: 'rowhead', role: 'row' }, h('span', { role: 'columnheader' }, 'Competency'), h('span', { role: 'columnheader' }, 'My score'), h('span', { role: 'columnheader' }, 'Benchmark'), h('span', { role: 'columnheader' }, 'Gap')));
  cs.forEach((c, i) => {
    const b = l.bench[i], cur = eff(i);
    const select = h('select', { 'aria-label': 'My score for ' + c.name, onchange: e => {
      state.scores[skey(c)] = +e.target.value; e.target.classList.add('edited'); lsSet(); writeHash(); updateDerived(); } });
    if (b === null && cur === undefined) select.append(h('option', { value: '', selected: true, disabled: true }, '–'));
    d.scale.slice().sort((a, x) => a.score - x.score).forEach(x => select.append(h('option', { value: x.score, selected: cur === x.score }, x.score + ' · ' + x.label)));
    if (state.scores[skey(c)] !== undefined) select.classList.add('edited');
    const gapHost = h('span', { role: 'cell' });
    refs.gaps[i] = gapHost; refs.selects[i] = select;
    const rowEl = h('div', { class: 'row', role: 'row' },
      h('span', { class: 'cname', role: 'cell' }, c.name, levelText(l, c) && h('span', { class: 'cdef' }, levelText(l, c))),
      h('span', { role: 'cell' }, h('span', { class: 'lab' }, 'My score'), select),
      h('span', { role: 'cell' }, h('span', { class: 'lab' }, 'Benchmark'), b === null ? '–' : b + ' · ' + labelOf(b)),
      h('span', { role: 'cell' }, h('span', { class: 'lab' }, 'Gap'), gapHost));
    refs.rows[i] = rowEl; rows.append(rowEl);
  });
  refs.sum = h('p', { class: 'sum', role: 'status' });
  refs.radar = h('div');
  refs.legend = h('div', { class: 'legend' }, h('span', null, svgKey('mine'), 'You'), h('span', null, svgKey('bench'), 'Benchmark for ' + l.code));
  sc.append(h('h2', null, 'Where you are against ' + l.code), refs.sum,
    h('div', { class: 'tools' }, h('button', { class: 'btn', type: 'button', onclick: () => { cs.forEach(c => delete state.scores[skey(c)]); lsSet(); writeHash(); renderLevel(); } }, 'Reset scores to the benchmark')),
    h('div', { class: 'score-grid' }, rows, h('div', { class: 'radar-box' }, refs.radar, refs.legend, reference())));
  updateDerived();
}
function svgKey(kind){
  const sv = s('svg', { width: 26, height: 12, viewBox: '0 0 26 12', 'aria-hidden': 'true' });
  if (kind === 'mine'){ sv.append(s('line', { x1: 0, y1: 6, x2: 26, y2: 6, stroke: 'var(--mine)', 'stroke-width': 2.5 }), s('circle', { cx: 13, cy: 6, r: 4, fill: 'var(--mine)' })); }
  else { sv.append(s('line', { x1: 0, y1: 6, x2: 26, y2: 6, stroke: 'var(--bench)', 'stroke-width': 2, 'stroke-dasharray': '5 3' }), s('rect', { x: 9, y: 2, width: 8, height: 8, fill: 'var(--bench)' })); }
  return sv;
}
function updateDerived(){
  const l = lvl(), cs = comps();
  const mine = cs.map((c, i) => eff(i));
  mine.forEach((v, i) => { refs.rows[i].classList.toggle('short', v !== undefined && l.bench[i] !== null && v < l.bench[i]); refs.gaps[i].textContent = ''; refs.gaps[i].append(gapCell(v, l.bench[i])); });
  const pairs = mine.map((v, i) => [v, l.bench[i]]).filter(p => p[0] !== undefined && p[1] !== null);
  const edited = cs.some(c => state.scores[skey(c)] !== undefined);
  refs.sum.textContent = '';
  if (!edited) refs.sum.append('Scores start at the ' + l.code + ' benchmark. Change any score to see your gap. Your changes stay in this browser.');
  else if (pairs.length){
    const below = pairs.filter(p => p[0] < p[1]).length, avg = pairs.reduce((a, p) => a + p[0] - p[1], 0) / pairs.length;
    refs.sum.append(h('b', null, (pairs.length - below) + ' of ' + pairs.length), ' competencies at or above the ' + l.code + ' benchmark. Average gap ', h('b', null, (avg > 0 ? '+' : avg < 0 ? '−' : '') + Math.abs(avg).toFixed(1)), '.');
  }
  drawRadar(refs.radar, cs, l.bench, mine);
  renderGrowth(mine);
}
function renderGrowth(mine){
  const g = document.getElementById('growth'); g.textContent = '';
  const l = lvl(), nx = nextLevel(), cs = comps();
  if (!nx){ g.append(h('h2', null, 'Growing to the next level'), h('p', { class: 'empty', style: 'margin-top:6px' }, l.code + ' is the top level of this track.')); return; }
  g.append(h('h2', null, 'Growing to ' + nx.code + ' · ' + nx.title));
  g.append(h('p', { class: 'note' }, 'Competencies where ' + nx.code + ' expects more than your current score. Scores you have not changed use the ' + l.code + ' benchmark.'));
  const rows = [];
  cs.forEach((c, i) => { const nb = nx.bench[i], base = mine[i]; if (nb === null || base === undefined) return; if (nb > base) rows.push([c, base, nb]); });
  if (!rows.length) g.append(h('p', { class: 'empty', style: 'margin-top:10px' }, 'You meet or exceed the ' + nx.code + ' benchmark on every competency.'));
  else g.append(h('div', { style: 'overflow-x:auto' }, h('table', null,
    h('thead', null, h('tr', null, h('th', null, 'Competency, as ' + nx.code + ' expects it'), h('th', null, 'Now'), h('th', null, nx.code + ' expects'), h('th', null, 'Step up'))),
    h('tbody', null, rows.map(([c, base, nb]) => h('tr', null,
      h('td', null, h('b', null, c.name), levelText(nx, c) && h('span', { class: 'cdef' }, levelText(nx, c))),
      h('td', { class: 'num' }, base + ' · ' + labelOf(base)),
      h('td', { class: 'num' }, nb + ' · ' + labelOf(nb)),
      h('td', { class: 'num' }, h('span', { class: 'gap short' }, '+' + (nb - base)))))))));
  const blocks = [];
  if (nx.promotion) blocks.push(h('div', null, h('h3', null, 'Promotion signals for ' + nx.code), h('p', { style: 'white-space:pre-line;margin-top:6px' }, nx.promotion)));
  if (nx.good.length) blocks.push(h('div', null, h('h3', null, 'What good looks like at ' + nx.code), h('ul', null, nx.good.map(x => h('li', null, x)))));
  if (blocks.length) g.append(h('div', { class: 'cols2' }, blocks));
}
function reference(){
  const d = state.data, parts = [];
  if (d.scale.length) parts.push(h('div', null, h('h3', null, 'Scoring scale'),
    h('table', null, h('tbody', null, d.scale.slice().sort((a, b) => b.score - a.score).map(x => h('tr', null, h('td', null, h('b', null, x.score)), h('td', null, x.label), h('td', null, x.analogy)))))));
  const cw = [];
  if (cw.length) parts.push(h('div', { style: 'margin-top:20px' }, h('h3', null, 'Crosswalk from earlier research labels'),
    h('table', null, h('thead', null, h('tr', null, h('th', null, 'Label'), h('th', null, 'Score'), h('th', null, 'Meaning'))),
      h('tbody', null, cw.map(x => h('tr', null, h('td', null, h('b', null, x.label)), h('td', null, x.score), h('td', null, x.meaning)))))));
  return h('div', { class: 'refbox' }, parts);
}

/* ---------- loading ---------- */
function fmtDate(iso){ try { return new Date(iso).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' }); } catch(e){ return ''; } }
async function adopt(buf, source){
  const res = await parseWorkbook(buf);
  state.data = res.data; state.warnings = res.warnings; state.source = source; state.error = null;
  applyState(); render();
}
function useSnapshot(why){
  if (!SNAPSHOT) return false;
  state.data = SNAPSHOT.data; state.warnings = []; state.error = null;
  state.source = 'Built-in copy from ' + fmtDate(SNAPSHOT.generatedAt) + (why ? ' (' + why + ')' : '');
  applyState(); render(); return true;
}
async function init(){
  document.getElementById('file').addEventListener('change', async e => {
    const f = e.target.files[0]; if (!f) return;
    try { await adopt(await f.arrayBuffer(), 'Loaded from ' + f.name); }
    catch(err){ state.error = err.message; if (!state.data) state.source = ''; render(); }
    e.target.value = '';
  });
  if (/^https?:$/.test(location.protocol)){
    try {
      const r = await fetch(DATA_URL, { cache: 'no-store' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      await adopt(await r.arrayBuffer(), 'Live from ' + DATA_URL); return;
    } catch(err){ if (useSnapshot('could not load ' + DATA_URL)) return; state.error = 'Could not load ' + DATA_URL + ' (' + err.message + ').'; render(); return; }
  }
  if (!useSnapshot('')){ state.source = ''; render(); }
}
window.CareerLadder = { parseWorkbook, get state(){ return state; } };
init();
})();
</script>
